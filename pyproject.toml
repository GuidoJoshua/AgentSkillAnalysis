[project]
name = "skill-bottleneck"
version = "0.1.0"
description = "Decomposing agent skill-use failures into selection vs utilization bottlenecks"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1",
    "harbor==0.24.0",
    "openai>=1.50",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
sb = "sb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
